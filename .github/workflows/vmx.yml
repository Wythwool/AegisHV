name: vmx

on:
  workflow_dispatch:

jobs:
  guest:
    name: VMX nested KVM
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check VMX host
        run: |
          mkdir -p target/type1
          lscpu > target/type1/vmx-host.txt
          cat target/type1/vmx-host.txt
          test -c /dev/kvm
          grep -qw vmx /proc/cpuinfo
          sudo chmod 0666 /dev/kvm
      - uses: dtolnay/rust-toolchain@1.81.0
        with:
          targets: x86_64-unknown-none
          components: llvm-tools-preview
      - name: Build image
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 xorriso
          qemu-system-x86_64 --version
          mkdir -p target/limine
          curl -fL --retry 3 https://github.com/Limine-Bootloader/Limine/releases/download/v12.9.3/limine-binary.tar.xz -o target/limine.tar.xz
          echo 'e02a473c6dc6df25159697f94930272397f21fd86e5d4eeee61bba72c95ec8d2  target/limine.tar.xz' | sha256sum -c -
          tar -xf target/limine.tar.xz -C target/limine --strip-components=1
          make -C target/limine
          export PATH="$PWD/target/limine:$PATH"
          export AEGISHV_LIMINE_DIR="$PWD/target/limine"
          bash scripts/build-type1-limine-iso.sh --build-kernel
      - name: Run VMX guest
        run: bash scripts/type1-qemu-evidence.sh --image target/type1/aegishv-type1.iso --timeout 20
      - name: Serial output
        if: always()
        run: cat target/type1/*serial.log || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vmx-run
          path: |
            target/type1/*.txt
            target/type1/*serial.log
            target/type1/*.elf
            target/type1/*.iso
